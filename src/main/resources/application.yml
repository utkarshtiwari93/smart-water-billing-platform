spring:
  application:
    name: water-billing
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.protocols: TLSv1.2

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:waterdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    email: ${ADMIN_EMAIL:admin@water.local}
    password: ${ADMIN_PASSWORD}
  google:
    client-id: ${GOOGLE_CLIENT_ID:106960710029-oht199mamqb291qi3v7b1mdh9p11e0fq.apps.googleusercontent.com}
  mail:
    # When SMTP_USERNAME/SMTP_PASSWORD are unset, auth codes are printed in the backend console.
    console-codes-when-unconfigured: ${MAIL_CONSOLE_CODES:true}
  alerts:
    scheduler-enabled: ${ALERT_SCHEDULER_ENABLED:false}
    interval-ms: 900000
    initial-delay-ms: 60000
    # For Gmail, set MAIL_FROM to the same address as SMTP_USERNAME (or leave blank to auto-use it).
    mail-from: ${MAIL_FROM:}
  billing:
    payment-instructions: ${PAYMENT_INSTRUCTIONS:Please pay through the payment channel configured by your apartment administrator.}
  aquabot:
    enabled: ${AQUABOT_ENABLED:false}
    provider: ${AQUABOT_PROVIDER:none}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${AQUABOT_GEMINI_MODEL:}
      base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      connect-timeout-ms: ${AQUABOT_GEMINI_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${AQUABOT_GEMINI_READ_TIMEOUT_MS:60000}
      max-output-tokens: ${AQUABOT_GEMINI_MAX_OUTPUT_TOKENS:400}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${AQUABOT_OLLAMA_MODEL:}
      connect-timeout-ms: ${AQUABOT_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${AQUABOT_READ_TIMEOUT_MS:60000}
      max-output-tokens: ${AQUABOT_MAX_OUTPUT_TOKENS:400}